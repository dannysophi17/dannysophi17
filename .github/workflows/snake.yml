name: Generate Snake Contributions

on:
  schedule:
    - cron: "0 0 * * *"  
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: dannysophi17
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#7C3AED&color_dots=#EDE9FE,#C4B5FD,#A78BFA,#7C3AED,#5B21B6
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#DDD6FE&color_dots=#161B22,#3B0764,#5B21B6,#7C3AED,#A78BFA

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
