<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280">
  <rect width="1200" height="280" rx="18" fill="#0D1117"/>
  <rect x="18" y="18" width="1164" height="244" rx="12" fill="none" stroke="#800020" stroke-width="3"/>
  <rect x="38" y="38" width="12" height="12" fill="#FF6B9D"/>
  <rect x="58" y="38" width="12" height="12" fill="#FFB3C1"/>
  <rect x="78" y="38" width="12" height="12" fill="#FF9900"/>

  <!-- pixel stars -->
  <g shape-rendering="crispEdges">
    <rect x="1040" y="46" width="6" height="6" fill="#FFB3C1"/>
    <rect x="1070" y="76" width="5" height="5" fill="#FF9900"/>
    <rect x="1122" y="50" width="4" height="4" fill="#FF6B9D"/>
    <rect x="980" y="92" width="4" height="4" fill="#FFB3C1"/>
    <rect x="930" y="54" width="5" height="5" fill="#800020"/>
    <rect x="870" y="90" width="4" height="4" fill="#FF9900"/>
    <rect x="1006" y="122" width="4" height="4" fill="#FF6B9D"/>
  </g>

  <!-- terminal prompt -->
  <text x="58" y="92" fill="#FF6B9D" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="20" font-weight="700">$ whoami</text>
  <text x="58" y="148" fill="#FFF0F3" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="46" font-weight="800" letter-spacing="2">DANIELA COAVAS</text>
  <text x="60" y="188" fill="#FFB3C1" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="20">systems engineering · cloud · full stack · 3D web</text>

  <!-- pixel status -->
  <rect x="60" y="212" width="11" height="11" fill="#FF9900"/>
  <text x="82" y="223" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15">building in public</text>

  <!-- pixel cat -->
  <g transform="translate(935 132)" shape-rendering="crispEdges">
    <!-- tail -->
    <rect x="118" y="62" width="18" height="18" fill="#FFB3C1"/>
    <rect x="136" y="44" width="18" height="18" fill="#FFB3C1"/>
    <rect x="136" y="26" width="18" height="18" fill="#FFB3C1"/>
    <rect x="118" y="20" width="18" height="18" fill="#FFB3C1"/>
    <!-- body -->
    <rect x="44" y="54" width="74" height="64" fill="#FFB3C1"/>
    <rect x="30" y="72" width="18" height="46" fill="#FFB3C1"/>
    <!-- head -->
    <rect x="44" y="10" width="72" height="62" fill="#FFB3C1"/>
    <!-- ears -->
    <rect x="44" y="-8" width="20" height="24" fill="#FFB3C1"/>
    <rect x="96" y="-8" width="20" height="24" fill="#FFB3C1"/>
    <rect x="50" y="-2" width="8" height="10" fill="#800020"/>
    <rect x="102" y="-2" width="8" height="10" fill="#800020"/>
    <!-- face -->
    <rect x="62" y="32" width="8" height="8" fill="#0D1117"/>
    <rect x="92" y="32" width="8" height="8" fill="#0D1117"/>
    <rect x="78" y="45" width="8" height="7" fill="#FF6B9D"/>
    <!-- paws -->
    <rect x="50" y="112" width="22" height="12" fill="#FFF0F3"/>
    <rect x="92" y="112" width="22" height="12" fill="#FFF0F3"/>
  </g>

  <!-- pixel baseline -->
  <g shape-rendering="crispEdges">
    <rect x="872" y="254" width="36" height="4" fill="#800020"/>
    <rect x="914" y="254" width="18" height="4" fill="#FF6B9D"/>
    <rect x="938" y="254" width="52" height="4" fill="#800020"/>
    <rect x="996" y="254" width="12" height="4" fill="#FF9900"/>
    <rect x="1014" y="254" width="74" height="4" fill="#800020"/>
  </g>
</svg>
