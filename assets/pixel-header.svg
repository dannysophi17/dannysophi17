<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280">
  <rect width="1200" height="280" rx="18" fill="#0D1117"/>
  <rect x="18" y="18" width="1164" height="244" rx="12" fill="none" stroke="#5B21B6" stroke-width="3"/>

  <!-- top-left pixel controls -->
  <g shape-rendering="crispEdges">
    <rect x="38" y="38" width="12" height="12" fill="#5B21B6"/>
    <rect x="58" y="38" width="12" height="12" fill="#7C3AED"/>
    <rect x="78" y="38" width="12" height="12" fill="#A78BFA"/>
  </g>

  <!-- tiny pixel stars -->
  <g shape-rendering="crispEdges">
    <rect x="866" y="50" width="4" height="4" fill="#A78BFA"/>
    <rect x="920" y="78" width="5" height="5" fill="#7C3AED"/>
    <rect x="978" y="46" width="4" height="4" fill="#DDD6FE"/>
    <rect x="1034" y="80" width="6" height="6" fill="#A78BFA"/>
    <rect x="1098" y="52" width="4" height="4" fill="#7C3AED"/>
    <rect x="1138" y="94" width="5" height="5" fill="#DDD6FE"/>
    <rect x="1008" y="116" width="4" height="4" fill="#5B21B6"/>
  </g>

  <!-- terminal identity -->
  <text x="58" y="92" fill="#A78BFA"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="20" font-weight="700">$ whoami</text>

  <text x="58" y="148" fill="#E6EDF3"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="46" font-weight="800" letter-spacing="2">DANIELA COAVAS</text>

  <text x="60" y="188" fill="#DDD6FE"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="20">cloud · full stack · 3D web</text>

  <rect x="60" y="212" width="11" height="11" fill="#7C3AED"/>
  <text x="82" y="223" fill="#8B949E"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
        font-size="15">systems engineering student</text>

  <!-- pixel cat -->
  <g transform="translate(935 132)" shape-rendering="crispEdges">
    <!-- tail -->
    <rect x="118" y="62" width="18" height="18" fill="#A78BFA"/>
    <rect x="136" y="44" width="18" height="18" fill="#A78BFA"/>
    <rect x="136" y="26" width="18" height="18" fill="#A78BFA"/>
    <rect x="118" y="20" width="18" height="18" fill="#A78BFA"/>

    <!-- body -->
    <rect x="44" y="54" width="74" height="64" fill="#A78BFA"/>
    <rect x="30" y="72" width="18" height="46" fill="#A78BFA"/>

    <!-- head -->
    <rect x="44" y="10" width="72" height="62" fill="#A78BFA"/>

    <!-- ears -->
    <rect x="44" y="-8" width="20" height="24" fill="#A78BFA"/>
    <rect x="96" y="-8" width="20" height="24" fill="#A78BFA"/>
    <rect x="50" y="-2" width="8" height="10" fill="#5B21B6"/>
    <rect x="102" y="-2" width="8" height="10" fill="#5B21B6"/>

    <!-- face -->
    <rect x="62" y="32" width="8" height="8" fill="#0D1117"/>
    <rect x="92" y="32" width="8" height="8" fill="#0D1117"/>
    <rect x="78" y="45" width="8" height="7" fill="#7C3AED"/>

    <!-- paws -->
    <rect x="50" y="112" width="22" height="12" fill="#DDD6FE"/>
    <rect x="92" y="112" width="22" height="12" fill="#DDD6FE"/>
  </g>

  <!-- bottom pixel trail -->
  <g shape-rendering="crispEdges">
    <rect x="866" y="254" width="46" height="4" fill="#5B21B6"/>
    <rect x="918" y="254" width="18" height="4" fill="#7C3AED"/>
    <rect x="942" y="254" width="52" height="4" fill="#A78BFA"/>
    <rect x="1000" y="254" width="14" height="4" fill="#DDD6FE"/>
    <rect x="1020" y="254" width="78" height="4" fill="#5B21B6"/>
  </g>
</svg>
