<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
  <style>
    .e1 { transform-origin: 170px 150px; animation: spin 6s linear infinite; }
    .e2 { transform-origin: 170px 150px; animation: spin 8s linear infinite reverse; }
    .e3 { transform-origin: 170px 150px; animation: spin 10s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .core { animation: pulse 2.2s ease-in-out infinite; transform-origin: 170px 150px; }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }
    .tw { animation: tw 2.8s ease-in-out infinite; }
    .tw2 { animation: tw 3.6s ease-in-out infinite 1s; }
    @keyframes tw { 0%,100% { opacity: .15; } 50% { opacity: 1; } }
    .stat { opacity: 0; animation: up 12s infinite; }
    .s1 { animation-delay: .3s; } .s2 { animation-delay: .7s; } .s3 { animation-delay: 1.1s; }
    @keyframes up { 0% { opacity: 0; transform: translateY(8px); } 4% { opacity: 1; transform: translateY(0); } 94% { opacity: 1; } 100% { opacity: 0; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#1E1033"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <radialGradient id="nucleus">
      <stop offset="0%" stop-color="#F5F3FF"/>
      <stop offset="60%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="1197" height="297" rx="17" fill="none" stroke="#7C3AED" stroke-width="3"/>

  <g shape-rendering="crispEdges">
    <rect class="tw" x="1120" y="40" width="4" height="4" fill="#DDD6FE"/>
    <rect class="tw2" x="1060" y="250" width="4" height="4" fill="#A78BFA"/>
    <rect class="tw" x="360" y="260" width="3" height="3" fill="#A78BFA"/>
    <rect class="tw2" x="640" y="36" width="3" height="3" fill="#DDD6FE"/>
  </g>

  <!-- atom -->
  <g fill="none" stroke-width="2">
    <ellipse cx="170" cy="150" rx="110" ry="38" stroke="#7C3AED"/>
    <ellipse cx="170" cy="150" rx="110" ry="38" stroke="#A78BFA" transform="rotate(60 170 150)"/>
    <ellipse cx="170" cy="150" rx="110" ry="38" stroke="#C4B5FD" transform="rotate(-60 170 150)"/>
  </g>
  <g class="e1"><circle cx="280" cy="150" r="7" fill="#DDD6FE"/></g>
  <g class="e2" transform="rotate(60 170 150)"><circle cx="60" cy="150" r="6" fill="#A78BFA"/></g>
  <g class="e3"><circle cx="170" cy="40" r="6" fill="#C4B5FD"/></g>
  <circle class="core" cx="170" cy="150" r="26" fill="url(#nucleus)"/>
  <text x="170" y="160" text-anchor="middle" fill="#2E1065" font-size="26" font-weight="800">W</text>

  <!-- text -->
  <text x="340" y="70" fill="#A78BFA" font-size="16" font-weight="700">// PROYECTO · PROJECT</text>
  <text x="340" y="116" fill="#F5F3FF" font-size="42" font-weight="800" letter-spacing="1">Elemental W</text>
  <text x="340" y="150" fill="#DDD6FE" font-size="17">Aula digital para aprender ciencias básicas con evidencia</text>
  <text x="340" y="174" fill="#8B949E" font-size="15">Física · Química · Cálculo — Universidad EAN · Semillero Smart Farming</text>

  <rect x="340" y="190" width="300" height="30" rx="15" fill="#5B21B6"/>
  <text x="490" y="210" text-anchor="middle" fill="#F5F3FF" font-size="14" font-weight="700">✦ core team · mano derecha</text>

  <!-- stats -->
  <g class="stat s1">
    <text x="720" y="250" fill="#F5F3FF" font-size="30" font-weight="800">2</text>
    <text x="720" y="272" fill="#A78BFA" font-size="13">investigaciones</text>
  </g>
  <g class="stat s2">
    <text x="880" y="250" fill="#F5F3FF" font-size="30" font-weight="800">82</text>
    <text x="880" y="272" fill="#A78BFA" font-size="13">estudiantes</text>
  </g>
  <g class="stat s3">
    <text x="1040" y="250" fill="#F5F3FF" font-size="30" font-weight="800">18</text>
    <text x="1040" y="272" fill="#A78BFA" font-size="13">criterios</text>
  </g>
</svg>
